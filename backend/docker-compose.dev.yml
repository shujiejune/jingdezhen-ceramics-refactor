services:
  api:
    container_name: jdz-api
    build:
      context: .
      # Explicitly target the 'builder' stage, which has Go installed.
      target: builder
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      # Mount local source code into the container.
      - .:/app

    # Override the Dockerfile's CMD to run our app in development mode.
    # Using 'go run' allows us to see code changes without rebuilding the image.
    command: go run ./cmd/api/main.go

    environment:
      - SERVER_PORT=${SERVER_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GOOGLE_OAUTH_REDIRECT_URL=${GOOGLE_OAUTH_REDIRECT_URL}
      - GOOGLE_MAP_API_KEY=${GOOGLE_MAP_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=${DB_SSLMODE}
      - REDIS_URL=redis://redis:6379/0
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # Asynq worker (same image, `worker` run mode). Processes background jobs +
  # runs the cron scheduler. Single instance for the MVP (TDD §4.2).
  worker:
    container_name: jdz-worker
    build:
      context: .
      target: builder
    volumes:
      - .:/app
    command: go run ./cmd/api/main.go worker
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=${DB_SSLMODE}
      - REDIS_URL=redis://redis:6379/0
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-}
      - AIRWALLEX_CLIENT_ID=${AIRWALLEX_CLIENT_ID:-}
      - AIRWALLEX_API_KEY=${AIRWALLEX_API_KEY:-}
      - AIRWALLEX_ENV=${AIRWALLEX_ENV:-sandbox}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_ENV=${PAYPAL_ENV:-sandbox}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-plus}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - OSS_REGION=${OSS_REGION:-cn-hongkong}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  db:
    image: postgis/postgis:16-3.5-alpine
    container_name: jdz-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_db_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jdz-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: always
    # `redis-cli ping` returns "PONG" once Redis is ready.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5

volumes:
  postgres_db_data:
  redis_data:
