version: '3.8' # Use a version compatible with your Docker install

services:
  db:
    image: postgres:15 # Or your preferred PostgreSQL version (e.g., postgres:16)
    container_name: jingdezhen_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-yourdevuser} # Uses env var or defaults
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yourdevpassword}
      POSTGRES_DB: ${DB_NAME:-jingdezhen_dev_db}
    ports:
      - "${DB_PORT:-5432}:5432" # Map local port to container port
    volumes:
      - postgres_db_data:/var/lib/postgresql/data # Persist data across container restarts

volumes:
  postgres_db_data: # Defines a named volume for persistence
