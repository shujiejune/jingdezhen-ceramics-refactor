  /certificates/{code}:
    get:
      consumes:
      - application/json
      description: |-
        Public authenticity-certificate lookup by its JDZ-<6-base32> code
        (the QR target). Returns the cert + product/artist display info +
        the provenance chain. No auth.
      parameters:
      - description: Certificate code (JDZ-<6-base32>)
        in: path
        name: code
        required: true
        type: string
      - default: '"en-US"'
