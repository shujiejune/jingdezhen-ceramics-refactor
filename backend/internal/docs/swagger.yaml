            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "404":
          description: Artist not found (or not published in this locale)
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Get an artist by slug
      tags:
      - catalog
      - artists
  /auth/2fa/pending-confirm:
    post:
      consumes:
      - application/json
      description: |-
        Verifies the first TOTP code, enables 2FA, mints the real access token,
        and returns backup codes. Public (pending token is the credential).
      parameters:
      - description: pending_token + 6-digit code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.PendingTwoFAConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: AuthResponse + backup_codes
          schema:
            type: object
        "400":
          description: Invalid body / validation
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Invalid or expired pending token / invalid TOTP code
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Confirm 2FA enrollment + complete login
      tags:
      - auth
      - 2fa
  /auth/2fa/pending-enroll:
    post:
      consumes:
      - application/json
      description: |-
        Begins 2FA enrollment for a super_admin blocked at login. Public
        (the pending token is the credential). Returns the otpauth:// URI + raw secret.
      parameters:
      - description: pending_token + password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.PendingTwoFAEnrollRequest'
      produces:
      - application/json
      responses:
        "200":
          description: otpauth URI + raw secret
          schema:
            type: object
        "400":
          description: Invalid body / validation
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Invalid or expired pending token
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Start 2FA enrollment (must-enroll flow)
      tags:
      - auth
      - 2fa
  /auth/2fa/verify:
    post:
      consumes:
      - application/json
      description: |-
        Completes a 2FA-challenged login. Public (no JWT): the pending token +
        6-digit TOTP code are the credentials. On success mints the real access token.
      parameters:
      - description: pending_token + 6-digit code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.VerifyTwoFARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.AuthResponse'
        "400":
          description: Invalid body / validation
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Invalid or expired pending token / invalid TOTP code
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Complete 2FA login
      tags:
      - auth
      - 2fa
  /auth/activate:
    post:
      consumes:
      - application/json
      description: |-
        Activates an inactive account via the email activation token, then
        auto-logs the user in (mints a JWT).
      parameters:
      - description: Activation token (from email)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ActivationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.AuthResponse'
        "400":
          description: Invalid or expired activation token
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Activate a user account
      tags:
      - auth
  /auth/google/callback:
    get:
      description: |-
        Handles the Google OAuth callback: exchanges the code for a token,
        finds/creates the user, and either mints a JWT or issues a 2FA challenge.
        Redirects to the frontend with the token (or a 2FA pending_token).
      parameters:
      - description: OAuth state (must match the oauthstate cookie)
        in: query
        name: state
        required: true
        type: string
      - description: Authorization code from Google
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Redirect to frontend /login/success (or /2fa, /2fa/enroll,
            /error)
          schema:
            type: string
        "400":
          description: Authorization code not provided
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Invalid or missing state cookie / state mismatch
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Google OAuth callback
      tags:
      - auth
      - oauth
  /auth/google/login:
    get:
      description: Redirects the browser to Google's consent screen (sets an oauthstate
        cookie).
      produces:
      - application/json
      responses:
        "307":
          description: Redirect to Google consent screen
          schema:
            type: string
        "500":
          description: Could not initiate Google login
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Start Google OAuth login
      tags:
      - auth
      - oauth
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticates by email + password. If 2FA is enabled, returns a
        pending_token (HTTP 200 with a pending_token field) instead of a real
        access token; the client completes via /auth/2fa/verify.
        Super_admins without 2FA enrolled are blocked (must enroll via pending flow).
      parameters:
      - description: Login credentials (email, password)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: access_token (real or pending_token for 2FA)
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.AuthResponse'
        "401":
          description: Invalid credentials / account not active
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Log in
      tags:
      - auth
  /auth/request-password-reset:
    post:
      consumes:
      - application/json
      description: |-
        Sends a password-reset email if the account exists. Always returns a generic
        success message (anti-enumeration) regardless of whether the email exists.
      parameters:
      - description: Email to reset
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.RequestPasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{message: \"...\"}'
          schema:
            type: object
        "400":
          description: Invalid body / validation
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Request a password reset (step 1)
      tags:
      - auth
  /auth/resend-activation:
    post:
      consumes:
      - application/json
      description: |-
        Resends the activation email. Always returns a generic success message
        (to prevent email enumeration) regardless of whether the email exists.
      parameters:
      - description: Email to resend activation to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ResendActivationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{message: \"...\"}'
          schema:
            type: object
        "400":
          description: Invalid body / validation
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Resend the activation email
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: |-
        Completes a password reset: verifies the token, sets the new password,
        and mints a new JWT (auto-login).
      parameters:
      - description: Reset token + new password (min 8)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.AuthResponse'
        "400":
          description: Invalid body / validation / invalid or expired token
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Reset password (step 2)
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: |-
        Creates an inactive user account + sends an activation email.
        Returns a generic 201 (the user activates via email link).
      parameters:
      - description: Signup credentials (nickname, email, password)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.AuthResponse'
        "400":
          description: Invalid body / validation
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "409":
          description: Email address is already in use
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Sign up a new user
      tags:
      - auth
  /cart:
    get:
      consumes:
      - application/json
      description: |-
        Returns the signed-in user's cart, enriched with display info
        for the requested locale. Optional ?currency= adds presentment
        totals + per-line presentment prices (USD/EUR/GBP; FX-snapshotted).
        Stock is advisory at this stage (authoritative decrement at checkout).
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - default: '"en-US"'
        description: BCP 47 locale (e.g. en-US). Overrides Accept-Language.
        in: query
        name: locale
        type: string
      - description: Presentment currency (USD/EUR/GBP). Adds presentment totals +
          per-line prices.
        in: query
        name: currency
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.Cart'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the current user's cart
      tags:
      - cart
  /cart/items:
    delete:
      consumes:
      - application/json
      description: Removes all listed SKUs from the cart. Returns the count removed.
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: SKU IDs to remove (min 1)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.BulkRemoveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{"removed": <count>}'
          schema:
            type: object
        "400":
          description: Invalid body / validation (min 1 SKU ID)
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Bulk-remove items from the cart
      tags:
      - cart
    post:
      consumes:
      - application/json
      description: |-
        Adds a SKU to the cart. POST is additive: the existing qty for
        this SKU is incremented by qty (defaults to 1). A qty exceeding
        available stock returns 409 (advisory; authoritative decrement
        is at checkout).
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Item to add (qty optional, defaults to 1)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.AddCartItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created (empty body)
        "400":
          description: Invalid body / validation / qty < 1
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "404":
          description: SKU not in cart or does not exist
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "409":
          description: Quantity exceeds available stock
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add an item to the cart
      tags:
      - cart
  /cart/items/{sku_id}:
    delete:
      consumes:
      - application/json
      description: Removes a SKU from the cart entirely (not a decrement).
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: SKU ID
        in: path
        name: sku_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content (empty body)
        "400":
          description: Invalid SKU ID
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "404":
          description: SKU not in cart or does not exist
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove an item from the cart
      tags:
      - cart
    patch:
      consumes:
      - application/json
      description: |-
        Sets the quantity for a SKU in the cart to exactly qty (absolute,
        not additive). A qty exceeding available stock returns 409.
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: SKU ID
        in: path
        name: sku_id
        required: true
        type: integer
      - description: New quantity (absolute set, must be >= 1)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.UpdateCartItemRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content (empty body)
        "400":
          description: Invalid SKU ID / body / validation / qty < 1
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "404":
          description: SKU not in cart or does not exist
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "409":
          description: Quantity exceeds available stock
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set a cart item's quantity
      tags:
      - cart
  /cart/merge:
    post:
      consumes:
      - application/json
      description: |-
        Merges a guest localStorage cart (posted on login) into the
        signed-in user's server cart. Each guest item is upserted
        additively, capped at the SKU's stock. Returns the merged cart
        (same shape as GET /cart). Optional ?currency= adds presentment.
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - default: '"en-US"'
        description: BCP 47 locale (e.g. en-US). Overrides Accept-Language.
        in: query
        name: locale
        type: string
      - description: Presentment currency (USD/EUR/GBP).
        in: query
        name: currency
        type: string
      - description: Guest cart items to merge
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.MergeCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.Cart'
        "400":
          description: Invalid body / validation
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Merge a guest cart into the server cart
      tags:
      - cart
  /catalog/categories:
    get:
      description: Distinct categories across published products (bare strings for
        MVP).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: List product categories
      tags:
      - catalog
      - categories
  /catalog/products:
    get:
      consumes:
      - application/json
      description: |-
        Paginated list of published products in the requested locale.
        Supports filtering by category, artist, and tags (ANY-match).
        Locale resolution: ?locale= overrides Accept-Language.
      parameters:
      - default: '"en-US"'
        description: BCP 47 locale (e.g. en-US). Overrides Accept-Language.
        in: query
        name: locale
        type: string
      - description: Category name (exact match)
        in: query
        name: category
        type: string
      - description: Artist ID
        in: query
        name: artist
        type: integer
      - description: Comma-separated canonical tag keys (ANY-match, e.g. hand-painted,celadon-glaze)
        in: query
        name: tag
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.Product'
                  type: array
              type: object
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: List published products
      tags:
      - catalog
      - products
  /catalog/products/{id}/media:
    get:
      consumes:
      - application/json
      description: Returns a product's ordered gallery for the storefront. No auth.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ProductMediaItem'
            type: array
        "400":
          description: Invalid product id
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: List a product's media gallery (public)
      tags:
      - catalog
      - products
      - media
  /catalog/products/{slug}:
    get:
      consumes:
      - application/json
      description: |-
        Fetches a single published product by its locale-specific slug,
        with SKUs, gallery, and tags loaded. Optional ?currency= adds
        presentment pricing to each SKU (USD/EUR/GBP; FX-snapshotted).
      parameters:
      - description: Product slug (locale-specific)
        in: path
        name: slug
        required: true
        type: string
      - default: '"en-US"'
        description: BCP 47 locale (e.g. en-US). Overrides Accept-Language.
        in: query
        name: locale
        type: string
      - description: Presentment currency (USD/EUR/GBP). Adds `price` + `price_currency`
          to each SKU.
        in: query
        name: currency
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.Product'
        "400":
          description: Missing slug
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "404":
          description: Product not found (or not published in this locale)
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Get a product by slug
      tags:
      - catalog
      - products
  /catalog/tags:
    get:
      description: |-
        Tags attached to at least one published product, with the
        locale-resolved display name + a product count.
      parameters:
      - default: '"en-US"'
        description: BCP 47 locale (e.g. en-US). Overrides Accept-Language.
        in: query
        name: locale
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.TagWithCount'
            type: array
        "500":
