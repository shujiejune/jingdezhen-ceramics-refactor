          description: Invalid address ID / body / validation
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "404":
          description: Address not found (or not owned by user)
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace a shipping address (PUT semantics)
      tags:
      - profile
      - addresses
  /profile/addresses/{id}/default:
    post:
      consumes:
      - application/json
      description: |-
        Marks one of the signed-in user's addresses as the default
        (used as the checkout prefill).
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Address ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{message: \"Default address updated\"}'
          schema:
            type: object
        "400":
          description: Invalid address ID
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "404":
          description: Address not found (or not owned by user)
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set the default shipping address
      tags:
      - profile
      - addresses
  /shipping/quote:
    get:
      consumes:
      - application/json
      description: |-
        Public preview of the shipping fee for a country + packed weight,
        computed from the shipping_fee_tiers table. Returns shippable=false
        (with a reason) for unshippable countries or overweight packages.
      parameters:
      - description: Destination country (ISO 3166-1 alpha-2)
        in: query
        name: country
        required: true
        type: string
      - description: Packed weight in grams
        in: query
        name: weight
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ShippingQuoteResponse'
        "400":
          description: Invalid country (must be 2 letters) / weight (must be non-negative
            grams)
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Get a shipping quote
      tags:
      - shipping
  /webhooks/airwallex:
    post:
      consumes:
      - application/json
      description: |-
        Receives Airwallex payment events. Verifies the signature via
        the gateway, then acks 200 immediately (enqueue-and-ack). A
        signature mismatch returns 400. Idempotent on the idempotency_key.
      produces:
      - application/json
      responses:
        "200":
          description: OK (event acknowledged + enqueued)
        "400":
          description: Webhook signature verification failed
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "503":
          description: Payment gateway not configured
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Airwallex webhook
      tags:
      - webhooks
      - payments
  /webhooks/paypal:
    post:
      consumes:
      - application/json
      description: |-
        Receives PayPal payment events. Verifies the signature via the
        gateway, then acks 200 immediately (enqueue-and-ack). A signature
        mismatch returns 400. Idempotent on the idempotency_key.
      produces:
      - application/json
      responses:
        "200":
          description: OK (event acknowledged + enqueued)
        "400":
          description: Webhook signature verification failed
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "503":
          description: Payment gateway not configured
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: PayPal webhook
      tags:
      - webhooks
      - payments
  /wishlist:
    get:
      consumes:
      - application/json
      description: |-
        Paginated list of the signed-in user's favorited SKUs, enriched
        with the parent product's display info for the requested locale.
        Locale resolution: ?locale= overrides Accept-Language.
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - default: '"en-US"'
        description: BCP 47 locale (e.g. en-US). Overrides Accept-Language.
        in: query
        name: locale
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.WishlistItem'
                  type: array
              type: object
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List the current user's wishlist
      tags:
      - wishlist
    post:
      consumes:
      - application/json
      description: |-
        Favorites a SKU. Idempotent: favoriting an already-favorited
        SKU is a no-op (still returns 201). A nonexistent SKU returns 404.
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: SKU to favorite
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.AddWishlistRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created (empty body)
        "400":
          description: Invalid body / validation
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "404":
          description: SKU not found
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a SKU to the wishlist
      tags:
      - wishlist
  /wishlist/{sku_id}:
    delete:
      consumes:
      - application/json
      description: Unfavorites a SKU. Removing a SKU not in the wishlist returns 404.
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: SKU ID
        in: path
        name: sku_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content (empty body)
        "400":
          description: Invalid SKU ID
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "404":
          description: Wishlist item not found
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove a SKU from the wishlist
      tags:
      - wishlist
securityDefinitions:
  BearerAuth:
    description: '"Bearer <access_token>" — JWT access token from POST /auth/login
      (or OAuth). Required for all /admin/* and customer-authed endpoints; omitted
      for public /catalog/* reads.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
