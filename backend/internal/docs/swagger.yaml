info:
  contact:
    name: Jingdezhen Ceramics Platform Team
  description: |-
    Internationalized culture / e-commerce / custom-travel platform for Jingdezhen ceramic art.
    Backend in Go + Fiber; money as BIGINT minor units (CNY base, USD/EUR/GBP presentment).
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://jingdezhen.test/terms
  title: Jingdezhen Ceramics Platform API
  version: "1.0"
paths:
  /admin/artists:
    get:
      consumes:
      - application/json
      description: 'Paginated list of artists filtered by locale + status. Access:
        content_editor.'
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: BCP 47 locale
        in: query
        name: locale
        type: string
      - description: Filter by workflow status (draft|in_review|published|rejected)
        in: query
        name: status
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.Artist'
                  type: array
              type: object
        "400":
          description: Invalid locale
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "403":
          description: Forbidden (needs content.write)
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List artists (admin, any status)
      tags:
      - admin
      - artists
    post:
      consumes:
      - application/json
      description: |-
        Creates an artist + its first translation. Locale defaults to en-US.
        Access: content_editor.
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Artist to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.CreateArtistData'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.Artist'
        "400":
          description: Invalid body / validation / bad locale
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Authentication required
          schema:
