            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "404":
          description: Certificate not found
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Get a certificate's QR code (public)
      tags:
      - certificates
  /checkout:
    post:
      consumes:
      - application/json
      description: |-
        Converts the signed-in user's cart into an order: authoritative
        atomic stock decrement, FX-snapshot of presentment + CNY totals,
        address snapshot, shipping calculation. Returns the created
        order (with a hosted checkout URL in sandbox/live mode; empty
        in mock mode where the order auto-succeeds).
        Currency defaults to the user's preferred_currency (or USD).
        Gateway required in sandbox/live (airwallex|paypal); ignored in mock.
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Checkout details (address must belong to the user)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.CheckoutRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.Order'
        "400":
          description: Invalid body / validation / empty cart / unshippable / overweight
            / unsupported currency
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "404":
          description: Address not found
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "409":
          description: Insufficient stock to place the order
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Place an order from the cart
      tags:
      - orders
      - checkout
