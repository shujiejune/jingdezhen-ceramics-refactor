basePath: /
definitions:
  jingdezhen-ceramics-backend_internal_models.AddCartItemRequest:
    properties:
      qty:
        minimum: 1
        type: integer
      sku_id:
        type: integer
    required:
    - sku_id
    type: object
  jingdezhen-ceramics-backend_internal_models.AddWishlistRequest:
    properties:
      sku_id:
        type: integer
    required:
    - sku_id
    type: object
  jingdezhen-ceramics-backend_internal_models.Artist:
    properties:
      avatar_url:
        description: parent (non-localized media)
        type: string
      bio:
        description: translation
        type: string
      created_at:
        description: parent
        type: string
      display_order:
        description: parent
        type: integer
      id:
        type: integer
      locale:
        type: string
      meta_description:
        type: string
      meta_title:
        type: string
      name:
        description: Translation fields.
        type: string
      published_at:
        type: string
      slug:
        description: translation (per-locale unique)
        type: string
      status:
        $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ContentStatus'
      updated_at:
        description: parent
        type: string
      user_id:
        description: 'parent: link to users.id (UUID)'
        type: string
    type: object
  jingdezhen-ceramics-backend_internal_models.AttachMediaData:
    properties:
      caption:
        type: string
      media_id:
        type: integer
      sort_order:
        description: defaults to append-last
        minimum: 0
        type: integer
    required:
    - media_id
    type: object
  jingdezhen-ceramics-backend_internal_models.BulkRemoveRequest:
    properties:
      sku_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - sku_ids
    type: object
  jingdezhen-ceramics-backend_internal_models.CancelOrderRequest:
    properties:
      reason:
        maxLength: 500
        type: string
    type: object
  jingdezhen-ceramics-backend_internal_models.Cart:
    properties:
      currency:
        description: ISO 4217 (when ?currency=)
        type: string
      item_count:
        description: sum of distinct SKUs (not sum of qty)
        type: integer
      items:
        items:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.CartItem'
        type: array
      total:
        description: presentment minor units (when ?currency=)
        type: integer
      total_cny:
        description: sum of line_total_cny, minor units (fen)
        type: integer
    type: object
  jingdezhen-ceramics-backend_internal_models.CartItem:
    properties:
      added_at:
        type: string
      artist_name:
        type: string
      attributes:
        items:
          type: integer
        type: array
      line_total:
        description: presentment minor units
        type: integer
      line_total_cny:
        description: unit_price_cny * qty
        type: integer
      product_id:
        type: integer
      product_slug:
        type: string
      product_title:
        type: string
      qty:
        type: integer
      sku_code:
        type: string
      sku_id:
        type: integer
      stock:
        type: integer
      thumbnail_url:
        type: string
      unit_price:
        description: Presentment-currency fields (populated when ?currency= is supplied).
        type: integer
      unit_price_cny:
        description: minor units (fen)
        type: integer
      weight_grams:
        type: integer
    type: object
  jingdezhen-ceramics-backend_internal_models.Certificate:
    properties:
      artist_name:
        type: string
      artist_slug:
        type: string
      attributes:
        description: the product's default-SKU attributes
        items:
          type: integer
        type: array
      cert_code:
        type: string
      created_at:
        type: string
      id:
        type: integer
      issued_at:
        type: string
      pdf_key:
        type: string
      product_id:
        type: integer
      product_slug:
        type: string
      product_title:
        description: Display fields populated by the locale-aware JOIN (public page)
          — db:"-"
        type: string
      provenance:
        items:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ProvenanceRecord'
        type: array
      qr_key:
        type: string
      thumbnail_url:
        type: string
      updated_at:
        type: string
    type: object
  jingdezhen-ceramics-backend_internal_models.CheckoutRequest:
    properties:
      address_id:
        type: integer
      currency:
        type: string
      gateway:
        enum:
        - airwallex
        - paypal
        - mock
        type: string
    required:
    - address_id
    type: object
  jingdezhen-ceramics-backend_internal_models.ContentStatus:
    enum:
    - draft
    - in_review
    - published
    - rejected
    type: string
    x-enum-varnames:
    - StatusDraft
    - StatusInReview
    - StatusPublished
    - StatusRejected
  jingdezhen-ceramics-backend_internal_models.CreateAddressRequest:
    properties:
      city:
        maxLength: 100
        type: string
      country:
        description: alpha-2, e.g. "US"
        type: string
      is_default:
        type: boolean
      line1:
        maxLength: 255
        type: string
      line2:
        maxLength: 255
        type: string
      phone:
        maxLength: 30
        type: string
      postal_code:
        maxLength: 30
        type: string
      recipient:
        maxLength: 255
        type: string
      region:
        maxLength: 100
        type: string
    required:
    - city
    - country
    - line1
    - recipient
    type: object
  jingdezhen-ceramics-backend_internal_models.CreateArtistData:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      display_order:
        minimum: 0
        type: integer
      locale:
        type: string
      meta_description:
        type: string
      meta_title:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        type: string
      slug:
        maxLength: 100
        type: string
      user_id:
        description: 'optional: link to a platform user'
        type: string
    required:
    - name
    - slug
    type: object
  jingdezhen-ceramics-backend_internal_models.CreateShippingTierRequest:
    properties:
      country:
        type: string
      fee_cny:
        minimum: 0
        type: integer
      max_weight_grams:
        type: integer
    required:
    - country
    - max_weight_grams
    type: object
  jingdezhen-ceramics-backend_internal_models.ErrorResponse:
    properties:
      details:
        description: Optional additional details
        type: string
      message:
        type: string
    type: object
  jingdezhen-ceramics-backend_internal_models.MediaAsset:
    properties:
      created_at:
        type: string
      duration:
        description: seconds (videos)
        type: integer
      height:
        type: integer
      hls_key:
        description: transcoded HLS playlist (videos)
        type: string
      id:
        type: integer
      kind:
        description: image | video
        type: string
      mime:
        type: string
      oss_key:
        type: string
      public_url:
        description: PublicURL resolved at read time by the storage adapter. Not in
          DB.
        type: string
      updated_at:
        type: string
      uploaded_by:
        type: string
      width:
        type: integer
    type: object
  jingdezhen-ceramics-backend_internal_models.MergeCartItem:
    properties:
      qty:
        minimum: 1
        type: integer
      sku_id:
        type: integer
    required:
    - qty
    - sku_id
    type: object
  jingdezhen-ceramics-backend_internal_models.MergeCartRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.MergeCartItem'
        type: array
    type: object
  jingdezhen-ceramics-backend_internal_models.Order:
    properties:
      address:
        items:
          type: integer
        type: array
      cancel_reason:
        type: string
      cancelled_at:
        type: string
      carrier_name:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      currency:
        type: string
      fx_rate_used:
        description: rendered from string
        type: number
      hosted_url:
        description: |-
          HostedURL is the gateway's hosted-checkout URL (sandbox/live). Empty in
          mock mode. The client redirects the customer here to pay off-site.
        type: string
      id:
        type: integer
      items:
        description: Items loaded by the service (detail view only).
        items:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.OrderItem'
        type: array
      locale:
        type: string
      paid_at:
        type: string
      placed_at:
        type: string
      refunded_at:
        type: string
      shipped_at:
        type: string
      shipping_cny:
        type: integer
      shipping_minor:
        type: integer
      status:
        $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.OrderStatus'
      subtotal_cny:
        type: integer
      subtotal_minor:
        type: integer
      total_cny:
        type: integer
      total_minor:
        type: integer
      tracking_number:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  jingdezhen-ceramics-backend_internal_models.OrderItem:
    properties:
      attributes_snapshot:
        items:
          type: integer
        type: array
      created_at:
        type: string
      id:
        type: integer
      order_id:
        type: integer
      qty:
        type: integer
      sku_id:
        type: integer
      title_snapshot:
        items:
          type: integer
        type: array
      unit_price_cny:
        description: CNY base
        type: integer
      unit_price_minor:
        description: presentment
        type: integer
    type: object
  jingdezhen-ceramics-backend_internal_models.OrderStatus:
    enum:
    - created
    - paid
    - shipped
    - completed
    - cancelled
    - refunded
    type: string
    x-enum-varnames:
    - StatusCreated
    - StatusPaid
    - StatusShipped
    - StatusCompleted
    - StatusCancelled
    - StatusRefunded
  jingdezhen-ceramics-backend_internal_models.PaginatedResponse:
    properties:
      data: {}
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  jingdezhen-ceramics-backend_internal_models.Product:
    properties:
      artist_id:
        description: 'parent: FK to artists.id'
        type: integer
      artist_name:
        description: populated by service (joined or from artist_translations)
        type: string
      artist_slug:
        description: for cross-link to artist profile
        type: string
      category:
        description: 'parent: bare string for now (dead post-media; kept for back-comat)'
        type: string
      created_at:
        description: parent
        type: string
      description:
        type: string
      display_order:
        description: parent
        type: integer
      gallery:
        description: |-
          Gallery loaded by the service (detail view only). Empty when no
          product_media rows. The first item's media PublicURL is the preferred
          thumbnail; ThumbnailURL above is the fallback for back-comat.
        items:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ProductMediaItem'
        type: array
      id:
        type: integer
      locale:
        type: string
      meta_description:
        type: string
      meta_title:
        type: string
      published_at:
        type: string
      skus:
        description: SKUs loaded by the service (detail view only; omitted from list
          view).
        items:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.SKU'
        type: array
      slug:
        type: string
      status:
        $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ContentStatus'
      tags:
        description: |-
          Tags loaded by the service (list + detail views; batch-loaded to avoid N+1).
          `Name` is the locale-resolved display name (en-US → key fallback).
        items:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.Tag'
        type: array
      thumbnail_url:
        description: 'parent: primary display (dead post-media; gallery preferred)'
        type: string
      title:
        description: Translation fields.
        type: string
      updated_at:
        description: parent
        type: string
    type: object
  jingdezhen-ceramics-backend_internal_models.ProductMediaItem:
    properties:
      caption:
        type: string
      created_at:
        type: string
      id:
        description: product_media.id
        type: integer
      media:
        allOf:
        - $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.MediaAsset'
        description: The media asset, loaded via JOIN. Embedded so the JSON nests
          it.
      media_id:
        type: integer
      product_id:
        type: integer
      sort_order:
        type: integer
    type: object
  jingdezhen-ceramics-backend_internal_models.ProvenanceKind:
    enum:
    - created
    - sold
    - transferred
    type: string
    x-enum-comments:
      ProvenanceCreated: certificate issued / regenerated
      ProvenanceSold: order paid (TDD §8)
      ProvenanceTransferred: future ownership transfer
    x-enum-descriptions:
    - certificate issued / regenerated
    - order paid (TDD §8)
    - future ownership transfer
    x-enum-varnames:
    - ProvenanceCreated
    - ProvenanceSold
    - ProvenanceTransferred
  jingdezhen-ceramics-backend_internal_models.ProvenanceRecord:
    properties:
      at:
        type: string
      certificate_id:
        type: integer
      detail:
        items:
          type: integer
        type: array
      id:
        type: integer
      kind:
        $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ProvenanceKind'
    type: object
  jingdezhen-ceramics-backend_internal_models.RefundOrderRequest:
    properties:
      reason:
        maxLength: 500
        type: string
    type: object
  jingdezhen-ceramics-backend_internal_models.RegisterAssetData:
    properties:
      duration:
        description: videos
        minimum: 0
        type: integer
      height:
        minimum: 0
        type: integer
      kind:
        enum:
        - image
        - video
        type: string
      mime:
        type: string
      oss_key:
        type: string
      width:
        minimum: 0
        type: integer
    required:
    - kind
    - mime
    - oss_key
    type: object
  jingdezhen-ceramics-backend_internal_models.ReorderMediaItem:
    properties:
      media_id:
        type: integer
      sort_order:
        minimum: 0
        type: integer
    required:
    - media_id
    type: object
  jingdezhen-ceramics-backend_internal_models.SKU:
    properties:
      attributes:
        description: JSONB map
        items:
          type: integer
        type: array
      created_at:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      low_stock_threshold:
        type: integer
      price:
        description: |-
          Presentment-currency price (populated when the request carries ?currency=).
          Nil when no conversion was requested. TDD §7: converted at read time from
          the cached fx_rates, with the PRD rounding rule applied.
        type: integer
      price_cny:
        description: minor units (fen)
        type: integer
      price_currency:
        description: ISO 4217
        type: string
      product_id:
        type: integer
      sku_code:
        type: string
      stock:
        type: integer
      updated_at:
        type: string
      weight_grams:
        description: packed weight
        type: integer
    type: object
  jingdezhen-ceramics-backend_internal_models.ShipOrderRequest:
    properties:
      carrier_name:
        maxLength: 100
        type: string
      tracking_number:
        maxLength: 200
        type: string
    required:
    - carrier_name
    - tracking_number
    type: object
  jingdezhen-ceramics-backend_internal_models.ShippingFeeTier:
    properties:
      country:
        description: ISO 3166-1 alpha-2
        type: string
      created_at:
        type: string
      fee_cny:
        description: minor units (fen)
        type: integer
      id:
        type: integer
      max_weight_grams:
        type: integer
      updated_at:
        type: string
    type: object
  jingdezhen-ceramics-backend_internal_models.ShippingQuoteResponse:
    properties:
      country:
        type: string
      fee_cny:
        description: minor units (fen); 0 if unshippable/overweight
        type: integer
      reason:
        description: '"unshippable" | "overweight" | ""'
        type: string
      shippable:
        description: false if unshippable OR overweight
        type: boolean
      weight_grams:
        type: integer
    type: object
  jingdezhen-ceramics-backend_internal_models.Tag:
    properties:
      id:
        type: integer
      key:
        type: string
      name:
        description: locale-resolved (COALESCE in the JOIN)
        type: string
    type: object
  jingdezhen-ceramics-backend_internal_models.TagWithCount:
    properties:
      id:
        type: integer
      key:
        type: string
      name:
        description: locale-resolved (COALESCE in the JOIN)
        type: string
      product_count:
        type: integer
    type: object
  jingdezhen-ceramics-backend_internal_models.UpdateAddressRequest:
    properties:
      city:
        maxLength: 100
        type: string
      country:
        type: string
      is_default:
        type: boolean
      line1:
        maxLength: 255
        type: string
      line2:
        maxLength: 255
        type: string
      phone:
        maxLength: 30
        type: string
      postal_code:
        maxLength: 30
        type: string
      recipient:
        maxLength: 255
        type: string
      region:
        maxLength: 100
        type: string
    required:
    - city
    - country
    - line1
    - recipient
    type: object
  jingdezhen-ceramics-backend_internal_models.UpdateArtistData:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      display_order:
        minimum: 0
        type: integer
      meta_description:
        type: string
      meta_title:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        type: string
      slug:
        maxLength: 100
        type: string
      user_id:
        type: string
    type: object
  jingdezhen-ceramics-backend_internal_models.UpdateCartItemRequest:
    properties:
      qty:
        minimum: 1
        type: integer
    required:
    - qty
    type: object
  jingdezhen-ceramics-backend_internal_models.UpdateShippingTierRequest:
    properties:
      country:
        type: string
      fee_cny:
        minimum: 0
        type: integer
      max_weight_grams:
        type: integer
    required:
    - country
    - max_weight_grams
    type: object
  jingdezhen-ceramics-backend_internal_models.UserAddress:
    properties:
      city:
        type: string
      country:
        description: ISO 3166-1 alpha-2
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_default:
        type: boolean
      line1:
        type: string
      line2:
        type: string
      phone:
        type: string
      postal_code:
        type: string
      recipient:
        type: string
      region:
        type: string
      updated_at:
        type: string
    type: object
  jingdezhen-ceramics-backend_internal_models.WishlistItem:
    properties:
      artist_name:
        type: string
      attributes:
        items:
          type: integer
        type: array
      favorited_at:
        type: string
      price_cny:
        description: minor units (fen)
        type: integer
      product_id:
        type: integer
      product_slug:
        description: translation
        type: string
      product_title:
        description: translation
        type: string
      sku_code:
        type: string
      sku_id:
        type: integer
      stock:
        type: integer
      thumbnail_url:
        type: string
    type: object
info:
  contact:
    name: Jingdezhen Ceramics Platform Team
  description: |-
    Internationalized culture / e-commerce / custom-travel platform for Jingdezhen ceramic art.
    Backend in Go + Fiber; money as BIGINT minor units (CNY base, USD/EUR/GBP presentment).
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://jingdezhen.test/terms
  title: Jingdezhen Ceramics Platform API
  version: "1.0"
paths:
  /admin/artists:
    get:
      consumes:
      - application/json
      description: 'Paginated list of artists filtered by locale + status. Access:
        content_editor.'
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: BCP 47 locale
        in: query
        name: locale
        type: string
      - description: Filter by workflow status (draft|in_review|published|rejected)
        in: query
        name: status
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.Artist'
                  type: array
              type: object
        "400":
          description: Invalid locale
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "403":
          description: Forbidden (needs content.write)
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List artists (admin, any status)
      tags:
      - admin
      - artists
    post:
      consumes:
      - application/json
      description: |-
        Creates an artist + its first translation. Locale defaults to en-US.
        Access: content_editor.
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Artist to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.CreateArtistData'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.Artist'
        "400":
          description: Invalid body / validation / bad locale
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "401":
          description: Authentication required
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "403":
          description: Forbidden (needs content.write)
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an artist
      tags:
      - admin
      - artists
  /admin/artists/{id}:
    delete:
      consumes:
      - application/json
      description: 'Removes an artist (parent + all translations). Access: content_editor.'
      parameters:
      - description: Bearer <access_token>
        in: header
        name: Authorization
        required: true
        type: string
      - description: Artist ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content (empty body)
        "400":
          description: Invalid artist ID
          schema:
