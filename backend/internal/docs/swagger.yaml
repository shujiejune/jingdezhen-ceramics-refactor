      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.Certificate'
        "400":
          description: Missing code
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "404":
          description: Certificate not found
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Get a certificate by code (public)
      tags:
      - certificates
  /certificates/{code}/pdf:
    get:
      description: |-
        Serves the pre-rendered certificate PDF (302 redirect to the
        storage/CDN URL). ?download=1 forces an attachment; otherwise inline.
        404 when the PDF has not yet been generated (local mode / pre-render).
        No auth.
      parameters:
      - description: Certificate code (JDZ-<6-base32>)
        in: path
        name: code
        required: true
        type: string
      - description: '1 = force Content-Disposition: attachment'
        in: query
        name: download
        type: integer
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to the PDF storage URL
          schema:
            type: string
        "400":
          description: Missing code
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "404":
          description: Certificate not found / PDF not yet generated
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/jingdezhen-ceramics-backend_internal_models.ErrorResponse'
      summary: Download a certificate PDF (public)
      tags:
      - certificates
  /certificates/{code}/qr:
    get:
      description: |-
        Renders a QR PNG encoding the public certificate URL on-demand.
        Returns image/png (cached 24h; QR is stable per code). No auth.
      parameters:
      - description: Certificate code (JDZ-<6-base32>)
        in: path
        name: code
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
