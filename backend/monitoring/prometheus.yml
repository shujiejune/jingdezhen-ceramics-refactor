# Prometheus scrape config for the Jingdezhen Ceramics Platform.
# Scrapes the Go Fiber API's /metrics endpoint every 15 seconds.
# The Prometheus container reaches the api container over the Docker network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # --- Go Fiber API (serve mode) ---
  - job_name: "fiber-api"
    static_configs:
      - targets: ["api:1323"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  # --- Prometheus self-monitoring ---
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
